name: Deploy ChatServer to Local Environment

on:
  push:
    branches: [ prod ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'prod'
        type: choice
        options:
          - prod
          - main

jobs:
  deploy-chatserver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set deployment variables
        id: vars
        run: |
          BRANCH="${{ github.event.inputs.branch || 'prod' }}"
          COMMIT_SHA="${{ github.sha }}"
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "deployment_id=vimbiso-chatserver-$(date +%s)" >> $GITHUB_OUTPUT

      - name: Deploy vimbiso-chatserver service
        id: deploy
        run: |
          echo "🚀 Starting deployment of vimbiso-chatserver service..."
          echo "Branch: ${{ steps.vars.outputs.branch }}"
          echo "Commit: ${{ steps.vars.outputs.commit_sha }}"
          echo "Deployment ID: ${{ steps.vars.outputs.deployment_id }}"

          # Prepare deployment payload
          PAYLOAD=$(cat <<EOF
          {
            "service": "vimbiso-chatserver",
            "deploy_token": "${{ secrets.DEPLOY_TOKEN }}",
            "branch": "${{ steps.vars.outputs.branch }}",
            "commit_sha": "${{ steps.vars.outputs.commit_sha }}"
          }
          EOF
          )

          echo "📡 Calling deployment API..."

          # Call deployment API with retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT of $MAX_RETRIES..."

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-Request-ID: ${{ steps.vars.outputs.deployment_id }}" \
              -d "$PAYLOAD" \
              http://localhost:4000/api/deploy-chatserver)

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            RESPONSE_BODY=$(echo "$RESPONSE" | head -n -1)

            echo "HTTP Status: $HTTP_CODE"
            echo "Response: $RESPONSE_BODY"

            if [ "$HTTP_CODE" = "200" ]; then
              SUCCESS=true
              echo "✅ Deployment successful!"
              echo "response_body=$RESPONSE_BODY" >> $GITHUB_OUTPUT
              break
            elif [ "$HTTP_CODE" = "401" ]; then
              echo "❌ Authentication failed - invalid deploy token"
              exit 1
            elif [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
              echo "⏳ Deployment failed, retrying in 30 seconds..."
              sleep 30
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Deployment failed after $MAX_RETRIES attempts"
            echo "Final response: $RESPONSE_BODY"
            exit 1
          fi

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."

          # Wait a moment for services to stabilize
          sleep 15

          # Check ChatServer health
          echo "Checking ChatServer health..."
          HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/health/ || echo "000")

          if [ "$HEALTH_CHECK" = "200" ]; then
            echo "✅ ChatServer health check passed"
          else
            echo "⚠️  ChatServer health check returned: $HEALTH_CHECK"
            echo "This may be normal if the service is still starting up"
          fi

      - name: Report deployment status
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "🎉 Deployment Summary:"
            echo "✅ Service: vimbiso-chatserver"
            echo "✅ Branch: ${{ steps.vars.outputs.branch }}"
            echo "✅ Commit: ${{ steps.vars.outputs.commit_sha }}"
            echo "✅ Status: Successfully deployed"
            echo "✅ Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "🔗 Service URLs:"
            echo "   • ChatServer: http://localhost:9000"
            echo "   • Health: http://localhost:9000/health/"
          else
            echo "❌ Deployment Failed:"
            echo "   • Service: vimbiso-chatserver"
            echo "   • Branch: ${{ steps.vars.outputs.branch }}"
            echo "   • Commit: ${{ steps.vars.outputs.commit_sha }}"
            echo "   • Status: Failed"
            echo "   • Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "🔧 Troubleshooting:"
            echo "   • Check deployment token in repository secrets"
            echo "   • Verify local deployment API is running"
            echo "   • Review deployment logs above"
          fi

      - name: Create deployment artifact
        if: success()
        run: |
          mkdir -p deployment-artifacts
          cat > deployment-artifacts/deployment-info.json <<EOF
          {
            "service": "vimbiso-chatserver",
            "branch": "${{ steps.vars.outputs.branch }}",
            "commit_sha": "${{ steps.vars.outputs.commit_sha }}",
            "deployment_id": "${{ steps.vars.outputs.deployment_id }}",
            "timestamp": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "status": "success",
            "workflow_run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}"
          }
          EOF

      - name: Upload deployment artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info-${{ steps.vars.outputs.deployment_id }}
          path: deployment-artifacts/
          retention-days: 30
